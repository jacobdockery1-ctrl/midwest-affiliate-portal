<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MidWest Tees — Affiliate Admin</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--panel2:#1e222b;--line:#2a2f3a;--text:#f2f4f8;--muted:#9aa4b2;
    --brand:#5b8cff;--good:#39d98a;--warn:#ffb020;--radius:14px}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .wrap{max-width:1000px;margin:0 auto;padding:20px 18px 60px}
  header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--brand),#8a5bff);display:flex;align-items:center;justify-content:center;font-weight:800}
  h1{font-size:19px;margin:0}.sub{color:var(--muted);font-size:12px}
  .kpis{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px;min-width:150px}
  .kpi .lbl{color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
  .kpi .big{font-size:24px;font-weight:800;margin-top:3px}
  .kpi.owed .big{color:var(--good)}
  .btn{background:var(--brand);color:#fff;border:none;border-radius:9px;padding:9px 13px;font-weight:700;font-size:13px;cursor:pointer}
  .btn:active{transform:translateY(1px)}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
  .btn.good{background:var(--good);color:#06301f}
  .btn.sm{padding:6px 10px;font-size:12px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:18px}
  .panel h2{font-size:14px;margin:0 0 12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:11px;color:var(--muted)}
  input,select{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--text);font-size:14px;outline:none}
  input:focus{border-color:var(--brand)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
  td.owed{color:var(--good);font-weight:700}
  .muted{color:var(--muted)}
  .pill{font-size:11px;padding:3px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
  .gate{max-width:360px;margin:12vh auto;text-align:center}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:10px;font-size:13px;display:none}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:20px}
  .modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:480px;width:100%;padding:18px}
  pre{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;white-space:pre-wrap;font-size:13px;line-height:1.5}
  a{color:var(--brand)}
  .demo{margin-left:auto;font-size:10px;font-weight:700;padding:4px 8px;border-radius:999px;background:#3a2a10;color:var(--warn);border:1px solid #4d3a17;text-transform:uppercase;letter-spacing:.5px}
</style>
</head>
<body>
<!-- Password gate -->
<div id="gate" class="gate">
  <div class="logo" style="margin:0 auto 14px">MW</div>
  <h1>Affiliate Admin</h1>
  <p class="sub">Enter the admin password.</p>
  <div class="row" style="justify-content:center;margin-top:10px">
    <input id="pw" type="password" placeholder="Password" onkeydown="if(event.key==='Enter')enter()">
    <button class="btn" onclick="enter()">Enter</button>
  </div>
  <p id="gateErr" class="sub" style="color:var(--warn)"></p>
</div>

<!-- Dashboard -->
<div id="dash" class="wrap" style="display:none">
  <header>
    <div class="logo">MW</div>
    <div><h1>Affiliate Admin</h1><div class="sub">MidWest Tees</div></div>
    <span id="demoTag" class="demo" style="display:none">Demo</span>
  </header>

  <div class="kpis">
    <div class="kpi"><div class="lbl">Affiliates</div><div class="big" id="kAff">–</div></div>
    <div class="kpi"><div class="lbl">Sales driven</div><div class="big" id="kSales">–</div></div>
    <div class="kpi owed"><div class="lbl">Total owed</div><div class="big" id="kOwed">–</div></div>
  </div>

  <div class="panel">
    <h2>Add affiliate</h2>
    <div class="row">
      <div class="field"><label>Name</label><input id="aName" placeholder="Sarah Jones"></div>
      <div class="field"><label>Venmo username</label><input id="aVenmo" placeholder="sarah-jones"></div>
      <div class="field"><label>Email (optional)</label><input id="aEmail" placeholder="sarah@email.com"></div>
      <div class="field"><label>Rate %</label><input id="aRate" type="number" value="10" style="width:80px"></div>
      <button class="btn" onclick="addAff()">Create + get link</button>
    </div>
  </div>

  <div class="panel">
    <h2>Affiliates</h2>
    <div style="overflow-x:auto">
      <table>
        <thead><tr>
          <th>Name</th><th>Tag</th><th>Orders</th><th>Sales</th><th>Earned</th><th>Paid</th><th>Owed</th><th></th>
        </tr></thead>
        <tbody id="rows"><tr><td colspan="8" class="muted">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>

  <div class="panel">
    <h2>Post Library — stuff affiliates pull &amp; post</h2>
    <div class="row">
      <div class="field" style="flex:1;min-width:180px"><label>Title</label><input id="iTitle" placeholder="Destash: Beer Spangle Tee"></div>
      <div class="field"><label>Price / deal</label><input id="iPrice" placeholder="$8 clearance"></div>
      <div class="field" style="flex:1;min-width:180px"><label>Shopify handle (optional — links to that product)</label><input id="iHandle" placeholder="beer-spangle-tees"></div>
    </div>
    <div class="row" style="margin-top:10px">
      <div class="field" style="flex:1;min-width:220px"><label>Short description</label><input id="iDesc" placeholder="Soft tri-blend, sizes S–XXL"></div>
      <div class="field"><label>Photo</label><input id="iImg" type="file" accept="image/*"></div>
    </div>
    <div class="field" style="margin-top:10px"><label>Talking points / caption for affiliates to copy</label>
      <textarea id="iTalk" rows="2" placeholder="Grab this before it's gone! Comment your size to order 👇" style="background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--text);font-size:14px;font-family:inherit"></textarea></div>
    <div style="margin-top:10px"><button class="btn" onclick="addItem()">Add to library</button></div>
    <div id="libRows" style="margin-top:14px"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="box">
  <h2 id="mTitle" style="margin-top:0">New affiliate 🎉</h2>
  <div id="mBody"></div>
  <div style="text-align:right;margin-top:12px"><button class="btn ghost" onclick="closeModal()">Close</button></div>
</div></div>

<script>
let PW="";
let DEMO=false;
const money=n=>"$"+Number(n||0).toFixed(2);
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.style.display='block';setTimeout(()=>el.style.display='none',1800);}
function h(hdrs={}){return Object.assign({'Content-Type':'application/json','x-admin-password':PW},hdrs);}

async function enter(){
  PW=document.getElementById('pw').value;
  const r=await fetch('/api/admin/affiliates',{headers:h()}).catch(()=>null);
  if(r&&r.ok){ show(await r.json()); }
  else if(r&&r.status===401){ document.getElementById('gateErr').textContent='Wrong password.'; }
  else { DEMO=true; show(demoData()); } // no backend → preview with demo data
}
function show(data){
  document.getElementById('gate').style.display='none';
  document.getElementById('dash').style.display='block';
  if(DEMO)document.getElementById('demoTag').style.display='inline-block';
  paint(data);
  loadItems();
}
function paint(data){
  const a=data.affiliates||[];
  document.getElementById('kAff').textContent=a.length;
  document.getElementById('kSales').textContent=money(a.reduce((s,r)=>s+(r.sales||0),0));
  document.getElementById('kOwed').textContent=money(data.totalOwed||0);
  const rows=document.getElementById('rows');
  rows.innerHTML = a.length ? '' : '<tr><td colspan="8" class="muted">No affiliates yet — add one above.</td></tr>';
  a.forEach(r=>{
    const tr=document.createElement('tr');
    const portal=location.origin+'/?token='+(r.token||'');
    tr.innerHTML=`<td>${esc(r.name)}</td><td class="muted">${esc(r.tag)}</td>
      <td>${r.orders??0}</td><td>${money(r.sales)}</td><td>${money(r.earned)}</td>
      <td>${money(r.paid)}</td><td class="owed">${money(r.owed)}</td>
      <td style="text-align:right">
        <button class="btn ghost sm" onclick="copy('${portal}')">Link</button>
        <button class="btn good sm" ${r.owed>0?'':'disabled style=opacity:.4'} onclick='pay(${JSON.stringify(r)})'>Pay ${money(r.owed)}</button>
      </td>`;
    rows.appendChild(tr);
  });
}
function esc(s){return String(s??'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));}
function copy(t){navigator.clipboard&&navigator.clipboard.writeText(t);toast('Copied!');}

async function addAff(){
  const name=document.getElementById('aName').value.trim();
  if(!name)return toast('Enter a name');
  const body={name,venmo:document.getElementById('aVenmo').value.trim(),
    email:document.getElementById('aEmail').value.trim(),
    rate:(parseFloat(document.getElementById('aRate').value)||10)/100};
  if(DEMO){demoAdd(body);return;}
  const r=await fetch('/api/admin/affiliates',{method:'POST',headers:h(),body:JSON.stringify(body)});
  const d=await r.json();
  if(!r.ok)return toast(d.error||'Error');
  showNew(d);
  document.getElementById('aName').value=document.getElementById('aVenmo').value=document.getElementById('aEmail').value='';
  refresh();
}
function showNew(d){
  const portal=location.origin+(d.portalPath||'');
  const welcome=(d.welcome||'').replace('{{PORTAL_URL}}',location.origin);
  document.getElementById('mBody').innerHTML=
    `<p><b>${esc(d.affiliate.name)}</b> is set up.</p>
     <p class="sub">Referral link</p><pre>${esc(d.affiliate.link)}</pre>
     <p class="sub">Their private portal</p><pre>${esc(portal)}</pre>
     <p class="sub">Welcome message (copy &amp; send)</p><pre id="welcomeTxt">${esc(welcome)}</pre>
     <button class="btn" onclick="copy(document.getElementById('welcomeTxt').textContent)">Copy welcome message</button>`;
  document.getElementById('modal').style.display='flex';
}
function closeModal(){document.getElementById('modal').style.display='none';}

async function pay(r){
  if(!confirm('Mark '+money(r.owed)+' as paid to '+r.name+'? This records the payout so it will not be paid twice.'))return;
  if(DEMO){toast('(demo) marked paid');return;}
  const res=await fetch('/api/admin/affiliate/'+r.id+'/pay',{method:'POST',headers:h(),body:JSON.stringify({})});
  const d=await res.json();
  if(!res.ok)return toast(d.error||'Error');
  if(d.venmo)window.open(d.venmo,'_blank');
  toast('Recorded! Opening Venmo…');
  refresh();
}
async function refresh(){if(DEMO)return;const r=await fetch('/api/admin/affiliates',{headers:h()});if(r.ok)paint(await r.json());}

/* ---- demo fallback (opening the file with no backend) ---- */
function demoData(){return{totalOwed:74.30,affiliates:[
  {id:'1',name:'Sarah Jones',tag:'sarah_jones',orders:6,sales:482,earned:48.2,paid:0,owed:48.2,token:'demo1'},
  {id:'2',name:'Jenny B',tag:'jenny_b',orders:3,sales:261,earned:26.1,paid:0,owed:26.1,token:'demo2'}
]};}
let demoState=demoData();
function demoAdd(b){const tag=b.name.toLowerCase().replace(/[^a-z0-9]+/g,'_');
  demoState.affiliates.push({id:String(Date.now()),name:b.name,tag,orders:0,sales:0,earned:0,paid:0,owed:0,token:'demo_'+tag});
  paint(demoState);
  showNew({affiliate:{name:b.name,link:'https://shopmidwesttees.com/?utm_source='+tag},portalPath:'/?token=demo_'+tag,
    welcome:'Hey '+b.name+'! You are a MidWest Tees affiliate. Share your link and earn 10 percent. https://shopmidwesttees.com/?utm_source='+tag});
}

/* ---- Post Library ---- */
async function addItem(){
  const title=document.getElementById('iTitle').value.trim();
  if(!title)return toast('Enter a title');
  const body={title,
    price:document.getElementById('iPrice').value.trim(),
    description:document.getElementById('iDesc').value.trim(),
    talking_points:document.getElementById('iTalk').value.trim(),
    product_handle:document.getElementById('iHandle').value.trim()};
  if(DEMO)return toast('(demo) item added');
  const send=async()=>{
    const r=await fetch('/api/admin/library',{method:'POST',headers:h(),body:JSON.stringify(body)});
    const d=await r.json();
    if(!r.ok)return toast(d.error||'Error');
    toast('Added to library!');
    ['iTitle','iPrice','iDesc','iTalk','iHandle'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('iImg').value='';
    loadItems();
  };
  const f=document.getElementById('iImg').files[0];
  if(f){const rd=new FileReader();rd.onload=()=>{body.image_base64=rd.result;send();};rd.readAsDataURL(f);}
  else send();
}
async function loadItems(){
  const wrap=document.getElementById('libRows');
  if(DEMO){wrap.innerHTML='<div class="muted">Items you add show here.</div>';return;}
  try{
    const r=await fetch('/api/admin/library',{headers:h()});
    const d=await r.json();const items=d.items||[];
    if(!items.length){wrap.innerHTML='<div class="muted">No items yet — add one above.</div>';return;}
    wrap.innerHTML='';
    items.forEach(it=>{
      const row=document.createElement('div');
      row.style.cssText='display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:8px 0';
      const img=it.image_url?('<img src="'+esc(it.image_url)+'" style="width:40px;height:40px;border-radius:6px;object-fit:cover">'):'<div style="width:40px;height:40px;border-radius:6px;background:var(--panel2)"></div>';
      row.innerHTML=img+'<div style="flex:1"><b>'+esc(it.title)+'</b> <span class="muted">'+esc(it.price||'')+'</span></div>';
      const b=document.createElement('button');b.className='btn ghost sm';b.textContent='Delete';b.onclick=()=>delItem(it.id);
      row.appendChild(b);wrap.appendChild(row);
    });
  }catch(e){wrap.innerHTML='<div class="muted">Could not load items.</div>';}
}
async function delItem(id){
  if(!confirm('Delete this item?'))return;
  const r=await fetch('/api/admin/library/'+id,{method:'DELETE',headers:h()});
  if(r.ok){toast('Deleted');loadItems();}else toast('Error');
}
</script>
</body>
</html>
